name: Enterprise Daily Database Backup

on:
  schedule:
    # Run every night at 00:00 UTC (05:30 AM Sri Lanka Time)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  backup:
    name: Backup Supabase Database
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd crm-web
          npm ci

      - name: Export Complete Encrypted Database Snapshot
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          node -e "
          const fs = require('fs');
          const { createClient } = require('@supabase/supabase-js');
          
          const supabase = createClient(process.env.NEXT_PUBLIC_SUPABASE_URL, process.env.SUPABASE_SERVICE_ROLE_KEY);
          
          async function backup() {
            const tables = ['students', 'households', 'enrollments', 'payments', 'student_balances', 'leads', 'members', 'audit_logs'];
            const backupPayload = { timestamp: new Date().toISOString(), tables: {} };
            
            for (const t of tables) {
              let rows = [];
              let from = 0;
              while (true) {
                const { data, error } = await supabase.from(t).select('*').range(from, from + 999);
                if (error) { console.error('Error backing up ' + t, error); break; }
                rows = rows.concat(data || []);
                if (!data || data.length < 1000) break;
                from += 1000;
              }
              backupPayload.tables[t] = rows;
              console.log('Backed up ' + t + ': ' + rows.length + ' rows');
            }
            
            if (!fs.existsSync('backups')) fs.mkdirSync('backups');
            const filename = 'backups/MathsPS_Backup_' + new Date().toISOString().slice(0, 10) + '.json';
            fs.writeFileSync(filename, JSON.stringify(backupPayload, null, 2));
            console.log('Backup written successfully to ' + filename);
          }
          backup();
          "

      - name: Upload Backup Artifact (Kept 90 days Free on GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: MathsPS-Database-Backup-${{ github.sha }}
          path: backups/
          retention-days: 90
