<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="logoGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3b82f6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8b5cf6;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <!-- Background rounded square -->
  <rect x="4" y="4" width="92" height="92" rx="22" ry="22" fill="url(#logoGrad)" filter="url(#glow)"/>
  <!-- Inner glass highlight -->
  <rect x="4" y="4" width="92" height="46" rx="22" ry="22" fill="rgba(255,255,255,0.12)"/>
  <!-- M lettermark -->
  <text x="50" y="67" text-anchor="middle" font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif" font-weight="900" font-size="58" fill="white" letter-spacing="-2" filter="url(#glow)">M</text>
</svg>
